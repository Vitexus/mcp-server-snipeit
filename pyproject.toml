[project]
name = "mcp-server-snipeit"
version = "2.0.1"
description = "MCP server for Snipe-IT inventory management system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "snipeit", "inventory", "asset-management", "ai"]
dependencies = [
    "fastmcp>=4.1.4",
    "requests>=2.31.0",
    "snipeit-api>=0.5.2",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "responses>=0.23.0"]

[project.urls]
Homepage = "https://github.com/jameshgordy/snipeit-mcp"
Repository = "https://github.com/Vitexus/mcp-server-snipeit"
Upstream = "https://github.com/jameshgordy/snipeit-mcp"
Issues = "https://github.com/jameshgordy/snipeit-mcp/issues"

[project.scripts]
mcp-server-snipeit = "mcp_server_snipeit.__main__:main"
snipeit-mcp = "mcp_server_snipeit.__main__:main"  # compatibility alias

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
asyncio_mode = "auto"
